<!DOCTYPE html>
<html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body{
            font-family:Arial,sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content:center;
            align-items: center;
            height: 100vh;

        }
        .container{
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: center;
            width: 300px;

        }
        input{
            width: 90%;
            padding: 10px;
            margin: 10px 0;
        }
        button{
            padding: 10px 15px;
            margin: 5px;
            border: none;
            background-color: #007bff;
            color:white;
            cursor:pointer;
        }
        #output{
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
 </head>
 <body>
   <div class="container"> 
     <h2>User verification system</h2>

     <input type="text" id="name" placeholder="Enter your name"><br>
     <input type="text" id="email" placeholder="Enter your email"><br>
     <button onclick="validateForm()">Submit</button>
     <button onclick="clearData()">Clear</button>   

     <p id="output"></p>
    </div>
    <script>
        function validateForm(){
            let name= document.getElementById("name").value.trim();
            let email= document.getElementById("email").value.trim();

            let output = document.getElementById("output");

            if(name===""|| email==="")
        {
            output.innerText= "All fields are required!";
            return;

        }
        if(!email.includes("@")|| !email.includes("."))
        {
            output.innerText="Enter a valid email address!";
            return;
        }
        output.innerText="Welcome "+ name +"! Your data is verified succesfully";
        }
        function clearData(){
            document.getElementById("name").value="";
            document.getElementById("email").value="";
            document.getElementById("output").innerText ="";
            
        }
    </script>
 </body>
</html>
